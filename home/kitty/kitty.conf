font_family      IoskeleyMonoTerm Nerd Font
font_size        15.0

cursor_shape     underline

window_padding_width 10

hide_window_decorations titlebar-only
macos_option_as_alt yes
term xterm-256color

# Gruvbox Dark Hard
background #1d2021
foreground #ebdbb2
cursor     #ebdbb2
cursor_text_color #1d2021
selection_background #665c54
selection_foreground #ebdbb2

color0  #1d2021
color8  #928374
color1  #cc241d
color9  #fb4934
color2  #98971a
color10 #b8bb26
color3  #d79921
color11 #fabd2f
color4  #458588
color12 #83a598
color5  #b16286
color13 #d3869b
color6  #689d6a
color14 #8ec07c
color7  #a89984
color15 #ebdbb2

map ctrl+n new_os_window
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map ctrl+a>h launch --location=vsplit
map ctrl+a>j launch --location=hsplit
map ctrl+a>k launch --location=hsplit
map ctrl+a>l launch --location=vsplit
map ctrl+a>f toggle_layout stack
map ctrl+a>n next_tab
map ctrl+a>p previous_tab
map cmd+r load_config_file
